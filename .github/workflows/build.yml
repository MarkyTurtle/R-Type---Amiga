# Assemble every source, check it is byte-identical to the original files,
# and build a bootable disk image (WinUAE extended ADF) from the sources.
# Then the enhanced game's AmigaDOS disk (enhanced/tools/build.py), with its
# emulator tests (enhanced/tools/test_disk.py, test_menu.py).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # vasm (Volker Barthelmann / Frank Wille), from the GitHub mirror,
      # pinned so builds stay reproducible
      VASM_REPO: https://github.com/StarWolf3000/vasm-mirror
      VASM_COMMIT: a13e7e728a3dd5a9ba468bf479119e0bc23e70fd
      # salvador (Emmanuel Marty), the ZX0 packer, pinned the same way
      SALVADOR_REPO: https://github.com/emmanuel-marty/salvador
      SALVADOR_COMMIT: 1662b625a8dcd6f3f7e3491c88840611776533f5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache vasm
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: vasm/vasmm68k_mot
          key: vasm-${{ env.VASM_COMMIT }}

      - name: Build vasm
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet "$VASM_REPO" vasm
          git -C vasm checkout --quiet "$VASM_COMMIT"
          make -C vasm CPU=m68k SYNTAX=mot -j"$(nproc)"

      - name: Assemble and verify against the original files
        env:
          VASM: ${{ github.workspace }}/vasm/vasmm68k_mot
        run: |
          python3 -I original/tools/verify.py
          python3 -I original/tools/check_levelab.py

      - name: Build the disk image from the sources
        env:
          VASM: ${{ github.workspace }}/vasm/vasmm68k_mot
        run: |
          mkdir -p build
          python3 -I original/tools/build_disk.py --from-source build/R-Type.adf

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: R-Type-adf
          path: build/R-Type.adf
          if-no-files-found: error

      - name: Cache salvador
        id: salvador-cache
        uses: actions/cache@v4
        with:
          path: salvador/salvador
          key: salvador-${{ env.SALVADOR_COMMIT }}

      - name: Build salvador
        if: steps.salvador-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet "$SALVADOR_REPO" salvador
          git -C salvador checkout --quiet "$SALVADOR_COMMIT"
          make -C salvador -j"$(nproc)"

      - name: Build the enhanced disk
        env:
          VASM: ${{ github.workspace }}/vasm/vasmm68k_mot
          SALVADOR: ${{ github.workspace }}/salvador/salvador
        run: |
          pip install --quiet unicorn==2.1.4 amitools==0.9.1
          python3 -I enhanced/tools/build.py
          python3 -I enhanced/tools/test_disk.py
          python3 -I enhanced/tools/test_menu.py

      - name: Upload the enhanced disk image
        uses: actions/upload-artifact@v4
        with:
          name: R-Type-enhanced-adf
          path: enhanced/build/rtype.adf
          if-no-files-found: error
